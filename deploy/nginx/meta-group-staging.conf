server {
    listen 80;
    listen [::]:80;
    server_name staging.meta.nexeragroup.rw;
    return 308 https://staging.meta.nexeragroup.rw$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.meta.nexeragroup.rw;

    ssl_certificate /etc/letsencrypt/live/staging.meta.nexeragroup.rw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.meta.nexeragroup.rw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ~ ^/api(?:/|$) {
        proxy_pass https://staging-api.meta.nexeragroup.rw;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host staging-api.meta.nexeragroup.rw;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "";
        proxy_set_header X-Request-ID $request_id;
        proxy_ssl_server_name on;
        proxy_ssl_name staging-api.meta.nexeragroup.rw;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
        proxy_cache off;
    }

    location / {
        proxy_pass http://127.0.0.1:10511;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
